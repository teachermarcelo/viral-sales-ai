<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Redirecionando · VIRAL SALES AI</title><link rel="stylesheet" href="assets/css/app.css"></head>
<body><main class="auth-screen"><div class="auth-card"><div class="brand-mark">↗</div><p class="eyebrow">VIRAL SALES AI</p><h1>Preparando seu acesso</h1><p id="status" class="muted">Registrando o clique e redirecionando...</p></div></main>
<script>
(async()=>{
 const status=document.querySelector("#status");
 const code=new URLSearchParams(location.search).get("code");
 if(!code){status.textContent="Este link está incompleto.";return}
 try{
  const response=await fetch("https://nuyzvpkvawixidotuuio.supabase.co/functions/v1/vsa-track-click",{
   method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code})
  });
  const data=await response.json();
  if(!response.ok||!data.destination_url)throw new Error(data.error||"Link não encontrado");
  const destination=new URL(data.destination_url);
  if(!["https:","http:"].includes(destination.protocol))throw new Error("Destino inválido");
  status.textContent="Clique registrado. Redirecionando...";
  location.replace(destination.href);
 }catch(error){status.textContent=error.message||"Não foi possível validar este link."}
})();
</script></body></html>
